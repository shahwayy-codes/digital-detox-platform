<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px;
         font-family: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; background: #FFF9EF; color: #1B2340; }
  .box { max-width: 420px; }
  .ring { width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 20px; background: #2F6BFF; position: relative; }
  .ring::after { content: ""; position: absolute; inset: 17px; border: 4px solid #FFFFFF; border-radius: 50%; border-top-color: transparent; }
  p { color: #566080; line-height: 1.6; }
  button { box-shadow: 0 5px 0 #1B47C2; margin-top: 12px; padding: 12px 22px; border: 0; border-radius: 14px; font-weight: 700; cursor: pointer; color: #FFFFFF; background: #2F6BFF; }
</style>
</head>
<body>
<div class="box">
  <div class="ring"></div>
  <h1>You are offline</h1>
  <p>No internet right now. A good moment for a little digital detox. Reconnect and try again.</p>
  <button onclick="location.reload()">Try again</button>
</div>
</body>
</html>
