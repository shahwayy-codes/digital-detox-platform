<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot password</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container auth">
    <a class="brand center" th:href="@{/}"><span class="logo"></span><span>Detox</span></a>
    <h1>Forgot password</h1>
    <p>Enter your account email. An admin will be notified and will give you a temporary password.</p>

    <form th:action="@{/forgot-password}" method="post">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
        <button type="submit" class="btn">Request reset</button>
    </form>

    <p class="link-row"><a th:href="@{/login}">Back to log in</a></p>
</div>
</body>
</html>
