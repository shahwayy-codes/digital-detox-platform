<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container auth">
    <a class="brand center" th:href="@{/}"><span class="logo"></span><span>Detox</span></a>
    <h1>Log in</h1>
    <div class="alert success" th:if="${registered}">Account created. Please log in.</div>
    <div class="alert success" th:if="${message}" th:text="${message}"></div>
    <div class="alert danger" th:if="${param.error}">Wrong email or password.</div>
    <div class="alert success" th:if="${param.logout}">You have been logged out.</div>
    <form th:action="@{/login}" method="post">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
        <button type="submit" class="btn">Log in</button>
    </form>
    <p class="link-row"><a th:href="@{/forgot-password}">Forgot your password?</a></p>
    <p class="link-row">No account yet? <a th:href="@{/register}">Register</a></p>
</div>
</body>
</html>
