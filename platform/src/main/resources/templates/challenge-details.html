<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Challenge details</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments :: navbar('challenges')}"></div>
<div class="container wide">
    <div class="topbar">
        <h1 th:text="${challenge.title}">Title</h1>
        <a class="btn small light" th:href="@{/challenges}">All challenges</a>
    </div>

    <p><span class="badge" th:text="${challenge.category}">Category</span></p>
    <p class="meta" th:if="${challenge.createdBy != null}">Created by <strong th:text="${challenge.createdBy.fullName}">Name</strong></p>
    <div class="alert success" th:if="${message}" th:text="${message}"></div>
    <div class="alert danger" th:if="${error}" th:text="${error}"></div>

    <p th:text="${challenge.description}">Description</p>

    <h3>Daily goal</h3>
    <p th:text="${challenge.dailyGoal}">Goal</p>

    <p class="meta">
        Duration: <strong th:text="${challenge.durationDays}">7</strong> days
        &middot; Participants: <strong th:text="${participants}">0</strong>
    </p>

    <form th:if="${!joined}" th:action="@{/challenges/{id}/join(id=${challenge.id})}" method="post">
        <button type="submit" class="btn">Join this challenge</button>
    </form>
    <div th:if="${joined}">
        <div class="alert success">You are part of this challenge.</div>
        <form th:action="@{/challenges/{id}/leave(id=${challenge.id})}" method="post">
            <button type="submit" class="btn light"
                    onclick="return confirm('Leave this challenge? Your check-ins for it will be deleted.');">Leave challenge</button>
        </form>
    </div>
    <h2 style="margin-top:28px;">Comments</h2>

    <form th:action="@{/challenges/{id}/comments(id=${challenge.id})}" method="post">
        <textarea name="content" rows="3" maxlength="500" required
                  placeholder="Share a tip or some encouragement"></textarea>
        <button type="submit" class="btn small" style="margin-top:10px;">Post comment</button>
    </form>

    <p th:if="${comments.isEmpty()}">No comments yet. Be the first.</p>

    <div class="card" style="margin-top:14px;" th:each="cm : ${comments}">
        <div class="card-head">
            <strong th:text="${cm.user.fullName}">Name</strong>
            <span class="meta" th:text="${cm.createdAt.toLocalDate()}">2026-01-01</span>
        </div>
        <p class="pre" th:text="${cm.content}">Comment</p>
        <div class="actions">
            <span class="badge no" th:if="${cm.reported}">Reported</span>
            <form th:if="${cm.user.id != currentUserId and !cm.reported}"
                  th:action="@{/comments/{cid}/report(cid=${cm.id})}" method="post">
                <button type="submit" class="btn small light">Report</button>
            </form>
            <form th:if="${cm.user.id == currentUserId or isAdmin}"
                  th:action="@{/comments/{cid}/delete(cid=${cm.id})}" method="post">
                <button type="submit" class="btn small light"
                        onclick="return confirm('Delete this comment?');">Delete</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
