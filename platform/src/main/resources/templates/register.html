<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container auth">
    <a class="brand center" th:href="@{/}"><span class="logo"></span><span>Detox</span></a>
    <h1>Create account</h1>
    <form th:action="@{/register}" th:object="${registerForm}" method="post">
        <label for="fullName">Full name</label>
        <input type="text" id="fullName" th:field="*{fullName}">
        <p class="error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></p>

        <label for="email">Email</label>
        <input type="email" id="email" th:field="*{email}">
        <p class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>

        <label for="password">Password</label>
        <input type="password" id="password" th:field="*{password}">
        <p class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>

        <label for="confirmPassword">Confirm password</label>
        <input type="password" id="confirmPassword" th:field="*{confirmPassword}">
        <p class="error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>

        <button type="submit" class="btn">Register</button>
    </form>
    <p class="link-row">Already have an account? <a th:href="@{/login}">Log in</a></p>
</div>
</body>
</html>
